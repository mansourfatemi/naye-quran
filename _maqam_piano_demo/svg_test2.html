<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{background:#1a1a2e;}</style></head><body><svg id="svgDesc" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:20px auto"></svg><svg id="svgAsc"  xmlns="http://www.w3.org/2000/svg" style="display:block;margin:20px auto"></svg><script>function drawAscDescSVG(svgEl, notes, intervals, jinsBoundary, color1, color2, label1, label2){
  const ns = 'http://www.w3.org/2000/svg';
  const step = 70, startX = 44, noteY = 70, H = 165;
  const W = startX * 2 + step * (notes.length - 1);

  function el(tag, attrs){
    const e = document.createElementNS(ns, tag);
    Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k,v));
    return e;
  }
  function txt(x, y, str, attrs={}){
    const t = el('text',{x,y,'text-anchor':'middle','dominant-baseline':'middle',
      'font-family':'Vazirmatn,Tahoma,sans-serif','font-size':'12',...attrs});
    t.textContent=str; return t;
  }

  svgEl.innerHTML='';
  svgEl.setAttribute('viewBox','0 0 '+W+' '+H);
  svgEl.setAttribute('width', W);
  svgEl.setAttribute('height', H);

  // کروشه جنس 1 بالا
  const bY=10, bH=14;
  const bx1=startX, bx2=startX+step*jinsBoundary;
  [el('line',{x1:bx1+1,y1:bY,x2:bx1+1,y2:bY+bH,stroke:color1,'stroke-width':'2.5'}),
   el('line',{x1:bx1,y1:bY,x2:bx2,y2:bY,stroke:color1,'stroke-width':'2.5'}),
   el('line',{x1:bx2-1,y1:bY,x2:bx2-1,y2:bY+bH,stroke:color1,'stroke-width':'2.5'}),
   txt((bx1+bx2)/2,bY-8,label1,{'font-size':'11','font-weight':'bold',fill:color1})
  ].forEach(e=>svgEl.appendChild(e));

  // کروشه جنس 2 بالا
  const bx3=startX+step*jinsBoundary, bx4=startX+step*(notes.length-1);
  [el('line',{x1:bx3+1,y1:bY,x2:bx3+1,y2:bY+bH,stroke:color2,'stroke-width':'2.5'}),
   el('line',{x1:bx3,y1:bY,x2:bx4,y2:bY,stroke:color2,'stroke-width':'2.5'}),
   el('line',{x1:bx4-1,y1:bY,x2:bx4-1,y2:bY+bH,stroke:color2,'stroke-width':'2.5'}),
   txt((bx3+bx4)/2,bY-8,label2,{'font-size':'11','font-weight':'bold',fill:color2})
  ].forEach(e=>svgEl.appendChild(e));

  // خط اصلی
  svgEl.appendChild(el('line',{x1:startX,y1:noteY,x2:startX+step*(notes.length-1),y2:noteY,stroke:'#555','stroke-width':'2'}));

  // نتها
  notes.forEach((name,i)=>{
    const x = startX+step*i;
    const isTonic = (i===0||i===notes.length-1);
    const isShared = (i===jinsBoundary);
    const c = i<=jinsBoundary ? color1 : color2;
    const r = isTonic ? 19 : 16;
    if(isShared){
      svgEl.appendChild(el('path',{d:`M ${x} ${noteY-r} A ${r} ${r} 0 0 0 ${x} ${noteY+r} Z`,fill:color1}));
      svgEl.appendChild(el('path',{d:`M ${x} ${noteY-r} A ${r} ${r} 0 0 1 ${x} ${noteY+r} Z`,fill:color2}));
      svgEl.appendChild(el('circle',{cx:x,cy:noteY,r:r,fill:'none',stroke:'#fff','stroke-width':'1.5'}));
    } else {
      svgEl.appendChild(el('circle',{cx:x,cy:noteY,r:r,fill:c}));
      if(isTonic) svgEl.appendChild(el('circle',{cx:x,cy:noteY,r:r+3,fill:'none',stroke:c,'stroke-width':'2','opacity':'0.5'}));
    }
    svgEl.appendChild(txt(x,noteY,String(i+1),{'font-size':'11','font-weight':'bold',fill:'#fff'}));
    svgEl.appendChild(txt(x,noteY+r+13,name,{'font-size':'12','font-weight':'bold',fill:'#ddd'}));
  });

  // فواصل زیر نتها — جدا از دایرهها
  intervals.forEach((interval,i)=>{
    const x = startX+step*i+step/2;
    const c = i<jinsBoundary ? color1 : color2;
    svgEl.appendChild(el('line',{x1:x,y1:noteY+22,x2:x,y2:noteY+32,stroke:c,'stroke-width':'1.5','stroke-dasharray':'3,2'}));
    svgEl.appendChild(el('rect',{x:x-16,y:noteY+33,width:32,height:19,rx:'9',fill:c,'opacity':'0.2'}));
    svgEl.appendChild(el('rect',{x:x-16,y:noteY+33,width:32,height:19,rx:'9',fill:'none',stroke:c,'stroke-width':'1.5'}));
    svgEl.appendChild(txt(x,noteY+42,interval,{'font-size':'11','font-weight':'bold',fill:c}));
  });
}

function drawAscDescSVG3(svgEl, notes, intervals, b1, b2, c1, c2, c3, l1, l2, l3){
  const ns = 'http://www.w3.org/2000/svg';
  const step = 70, startX = 44, noteY = 80, H = 185;
  const W = startX * 2 + step * (notes.length - 1);

  function el(tag, attrs){
    const e = document.createElementNS(ns, tag);
    Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k,v));
    return e;
  }
  function txt(x, y, str, attrs={}){
    const t = el('text',{x,y,'text-anchor':'middle','dominant-baseline':'middle',
      'font-family':'Vazirmatn,Tahoma,sans-serif','font-size':'12',...attrs});
    t.textContent=str; return t;
  }

  svgEl.innerHTML='';
  svgEl.setAttribute('viewBox','0 0 '+W+' '+H);
  svgEl.setAttribute('width', W);
  svgEl.setAttribute('height', H);

  // کروشه جنس 1 بالا (ردیف 1)
  const bY1=8, bH=14;
  const bx1=startX, bx2=startX+step*b1;
  [el('line',{x1:bx1+1,y1:bY1,x2:bx1+1,y2:bY1+bH,stroke:c1,'stroke-width':'2.5'}),
   el('line',{x1:bx1,y1:bY1,x2:bx2,y2:bY1,stroke:c1,'stroke-width':'2.5'}),
   el('line',{x1:bx2-1,y1:bY1,x2:bx2-1,y2:bY1+bH,stroke:c1,'stroke-width':'2.5'}),
   txt((bx1+bx2)/2,bY1-7,l1,{'font-size':'11','font-weight':'bold',fill:c1})
  ].forEach(e=>svgEl.appendChild(e));

  // کروشه جنس 2 بالا (ردیف 2 — overlap)
  const bY2=26;
  const bx3=startX+step*1, bx4=startX+step*b2;
  [el('line',{x1:bx3+1,y1:bY2,x2:bx3+1,y2:bY2+bH,stroke:c2,'stroke-width':'2.5'}),
   el('line',{x1:bx3,y1:bY2,x2:bx4,y2:bY2,stroke:c2,'stroke-width':'2.5'}),
   el('line',{x1:bx4-1,y1:bY2,x2:bx4-1,y2:bY2+bH,stroke:c2,'stroke-width':'2.5'}),
   txt((bx3+bx4)/2,bY2-7,l2,{'font-size':'11','font-weight':'bold',fill:c2})
  ].forEach(e=>svgEl.appendChild(e));

  // کروشه جنس 3 بالا (ردیف 1)
  const bx5=startX+step*b2, bx6=startX+step*(notes.length-1);
  [el('line',{x1:bx5+1,y1:bY1,x2:bx5+1,y2:bY1+bH,stroke:c3,'stroke-width':'2.5'}),
   el('line',{x1:bx5,y1:bY1,x2:bx6,y2:bY1,stroke:c3,'stroke-width':'2.5'}),
   el('line',{x1:bx6-1,y1:bY1,x2:bx6-1,y2:bY1+bH,stroke:c3,'stroke-width':'2.5'}),
   txt((bx5+bx6)/2,bY1-7,l3,{'font-size':'11','font-weight':'bold',fill:c3})
  ].forEach(e=>svgEl.appendChild(e));

  // خط اصلی
  svgEl.appendChild(el('line',{x1:startX,y1:noteY,x2:startX+step*(notes.length-1),y2:noteY,stroke:'#555','stroke-width':'2'}));

  // نتها
  notes.forEach((name,i)=>{
    const x = startX+step*i;
    const isTonic = (i===0||i===notes.length-1);
    const c = i<b1 ? c1 : i<b2 ? c2 : c3;
    const r = isTonic ? 19 : 16;
    svgEl.appendChild(el('circle',{cx:x,cy:noteY,r:r,fill:c}));
    if(isTonic) svgEl.appendChild(el('circle',{cx:x,cy:noteY,r:r+3,fill:'none',stroke:c,'stroke-width':'2','opacity':'0.5'}));
    svgEl.appendChild(txt(x,noteY,String(i+1),{'font-size':'11','font-weight':'bold',fill:'#fff'}));
    svgEl.appendChild(txt(x,noteY+r+13,name,{'font-size':'12','font-weight':'bold',fill:'#ddd'}));
  });

  // فواصل زیر نتها
  intervals.forEach((interval,i)=>{
    const x = startX+step*i+step/2;
    const c = i<b1 ? c1 : i<b2 ? c2 : c3;
    svgEl.appendChild(el('line',{x1:x,y1:noteY+22,x2:x,y2:noteY+32,stroke:c,'stroke-width':'1.5','stroke-dasharray':'3,2'}));
    svgEl.appendChild(el('rect',{x:x-16,y:noteY+33,width:32,height:19,rx:'9',fill:c,'opacity':'0.2'}));
    svgEl.appendChild(el('rect',{x:x-16,y:noteY+33,width:32,height:19,rx:'9',fill:'none',stroke:c,'stroke-width':'1.5'}));
    svgEl.appendChild(txt(x,noteY+42,interval,{'font-size':'11','font-weight':'bold',fill:c}));
  });
}

// === draw asc/desc SVGs ===
(function(){
  var descNotes = ['ر','ر#','فا#','سل','لا','سی‌نیم‌بمل','دو','ر'];
  var descInts  = ['½','1½','½','1','¾','¾','1'];
  var ascNotes  = ['ر','می','فا','سل','لا','لا#','دو#','ر'];
  var ascInts   = ['1','1','½','1','½','1½','½'];
  var el1 = document.getElementById('svgDesc');
  var el2 = document.getElementById('svgAsc');
  if(el1) drawAscDescSVG(el1, descNotes, descInts, 3, '#c62828', '#1565c0', 'جنس حجاز', 'جنس راست');
  if(el2) drawAscDescSVG3(el2, ascNotes, ascInts, 3, 4, '#2e7d32', '#00695c', '#c62828', 'جنس کرد', 'جنس نهاوند', 'جنس حجاز');
})();
</script></body></html>
